# Central configuration file for Python tools

# --- Formatter Configuration ---
[tool.black]
line-length = 88
target-version = ['py311']

# --- Linter Configuration ---
# Esta es la nueva estructura anidada que 'ruff' prefiere
[tool.ruff]
line-length = 88

[tool.ruff.lint]
# E = Pyflakes Errors
# W = Pyflakes Warnings
# F = Flake8 (main rules)
# I = isort (import sorting)
select = ["E", "W", "F", "I"]

[tool.ruff.lint.isort]
# Tell isort that 'app' is our own source code
known-first-party = ["app"]

# --- Type Checker Configuration ---
[tool.mypy]
# Tell mypy to only scan the 'app' directory
files = ["app"]
# Tell mypy where to find modules (so 'app.domain...' works)
mypy_path = "app"
# CRITICAL: Ignore errors from libs that don't have types
ignore_missing_imports = true

# Esto le dice a mypy que trate los directorios
# sin __init__.py como paquetes, lo que soluciona
# el error "Source file found twice".
explicit_package_bases = true
namespace_packages = true


# --- Testing Configuration ---
[tool.pytest.ini_options]
# CRITICAL: Add the 'app' directory to Python's path
# This allows tests to do 'from app.domain.analysis...'
pythonpath = ["app"]
# Tell pytest where to look for tests
testpaths = ["tests"]